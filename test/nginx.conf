include /etc/nginx/modules.conf;

events {}

http {
    include /etc/nginx/crowdsec/crowdsec_nginx.conf;

    vhost_traffic_status_zone;

    modsecurity on;
    modsecurity_rules '
        SecRuleEngine On
        SecRule ARGS:attack "@streq test" "id:1001,phase:1,deny,status:403,msg:test-block"
    ';

    server {
        listen 8080;

        # health
        location /test/health {
            return 200 "ok";
        }

        # headers-more
        location /test/headers {
            more_set_headers "X-Test: ok";
            return 200 "ok";
        }

        # vts
        location /test/vts {
            vhost_traffic_status_display;
            vhost_traffic_status_display_format json;
        }

        # lua
        location /test/lua {
            content_by_lua_block {
                ngx.say("lua ok")
            }
        }

        # modsecurity - should block request with attack param
        location /test/modsecurity {
            return 200 "ok";
        }

        # brotli static
        location /test/brotli {
            alias /usr/share/nginx/html;
            brotli_static on;
        }

        # crowdsec passthrough
        location /test/crowdsec {
            return 200 "ok";
        }
    }
}
